[package]
name = "enzyme-spec"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Parser, resolver, and renderer for the readable .enzyme workspace language"
repository = "https://github.com/byenzyme/enzyme-spec"
readme = "README.md"
keywords = ["enzyme", "parser", "configuration", "dsl"]
categories = ["parser-implementations", "config"]

[dependencies]
anyhow = "1.0.86"
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"
# plan: revision digests, unified diffs, and the apply lock
sha2 = "0.10"
similar = "2.7"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3.10"
